# Packages Tutti and uploads it when a version tag is pushed (e.g. 1.0.0,
# 1.1.0-beta1). Its TOC names every client in one ## Interface line (Retail, the
# Classic clients, WoW Forever). The BigWigs packager tags the file with all of those
# game versions, names the zip Tutti-<tag>.zip, and uploads to every site
# whose project id is in the TOC and whose token is set as a repository secret:
#   CurseForge   ## X-Curse-Project-ID  + secret CF_API_KEY
#   Wago         ## X-Wago-ID           + secret WAGO_API_TOKEN   (optional)
#   WoWInterface ## X-WoWI-ID           + secret WOWI_API_TOKEN   (optional; no Forever there)
# A GitHub release with the zip is always created. Tags containing "alpha" or
# "beta" are uploaded as alpha/beta files. See docs/RELEASING.md.
#
# "Run workflow" (manual) is a dry run: it packages exactly the same way but
# uploads nothing and keeps the zip as a downloadable artifact.
name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Offline tests
        run: |
          sudo apt-get update -y
          sudo apt-get install -y luajit python3-pil
          luajit tests/run.lua
          luajit tests/syntax.lua
          python3 -I tests/test_media.py

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && '-d' || '' }}

      - name: Keep the zip (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Tutti-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
